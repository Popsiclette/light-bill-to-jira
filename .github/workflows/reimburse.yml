name: Auxílio Home Office

on:
  schedule:
    - cron: "0 12 1-10 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reimburse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: reimburse
        run: python reimburse.py
        env:
          TICKET_NAME: ${{ vars.TICKET_NAME }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          PDF_PASSWORD: ${{ secrets.PDF_PASSWORD }}
      - name: Notify on Telegram
        if: env.TELEGRAM_ENABLED == 'true' && (failure() || steps.reimburse.outputs.status == 'created')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ steps.reimburse.outputs.status }}
          MESSAGE: ${{ steps.reimburse.outputs.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          message="${MESSAGE:-❌ Falhou antes de executar o script.}"
          if [ "$STATUS" != "created" ]; then message="$message $RUN_URL"; fi
          curl -sS --fail-with-body -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${message}"
